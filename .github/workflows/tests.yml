name: Tests

# Läuft bei jedem Push und jeder Pull-Request auf macOS und Windows (die Systeme, auf denen LiedManager benutzt wird)
# und prüft, dass die Oberfläche startet und die wichtigsten Abläufe funktionieren (pytest: tests/, ohne Bildschirm).
# Von Hand startbar unter "Actions" -> "Tests" -> "Run workflow".
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Abhängigkeiten
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Syntax und Namen prüfen (ruff)
        run: ruff check --select F,E9 .
      - name: Tests (pytest)
        shell: bash
        timeout-minutes: 15
        env:
          PYTHONUTF8: "1"
          PYTHONUNBUFFERED: "1"
          QT_QPA_PLATFORM: offscreen
          SMOKE_TEST_TIMEOUT: "400"
        run: python -X faulthandler -m pytest -v
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshots-${{ matrix.os }}
          path: build/screenshots
          if-no-files-found: ignore
      - name: Remote-Seite aktuell?
        shell: bash
        run: python tools/build_remote_site.py --check

  # remote.php und sync.php mit echtem PHP und echter MySQL-Datenbank (wie beim Webhoster)
  server:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: liedmanager
          MYSQL_USER: lm
          MYSQL_PASSWORD: lm-test-pw
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo_mysql
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pytest
      - name: PHP-Syntax
        run: for f in server/*.php; do php -l "$f"; done
      - name: Server-Tests
        env:
          LM_TEST_MYSQL_HOST: 127.0.0.1
          LM_TEST_MYSQL_DB: liedmanager
          LM_TEST_MYSQL_USER: lm
          LM_TEST_MYSQL_PASS: lm-test-pw
        run: python -m pytest -v tests/test_server_php.py
