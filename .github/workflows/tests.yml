name: Tests

# Läuft bei jedem Push und jeder Pull-Request auf macOS und Windows (die Systeme, auf denen LiedManager benutzt wird)
# und prüft, dass die Oberfläche startet und die wichtigsten Abläufe funktionieren (pytest: tests/, ohne Bildschirm).
# Von Hand startbar unter "Actions" -> "Tests" -> "Run workflow".
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Abhängigkeiten
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Syntax und Namen prüfen (ruff)
        run: ruff check --select F,E9 .
      - name: Tests (pytest)
        shell: bash
        timeout-minutes: 15
        env:
          PYTHONUTF8: "1"
          PYTHONUNBUFFERED: "1"
          QT_QPA_PLATFORM: offscreen
          SMOKE_TEST_TIMEOUT: "400"
        run: python -X faulthandler -m pytest -v
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshots-${{ matrix.os }}
          path: build/screenshots
          if-no-files-found: ignore
      - name: Remote-Seite aktuell?
        shell: bash
        run: python tools/build_remote_site.py --check
